name: Deploy to Digital Ocean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Check secrets
        run: |
          echo "Host: ${{ secrets.DO_HOST }}"
          echo "Username: ${{ secrets.DO_USERNAME }}"
          echo "Port: ${{ secrets.DO_PORT }}"
          echo "Key length: $(echo '${{ secrets.DO_SSH_KEY }}' | wc -c)"

      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          script: |
            # Set error handling
            set -e

            # Define project path - adjust this to your actual deployment path
            PROJECT_PATH="/root/deshadow-frontend"

            # Navigate to your project directory
            echo "Navigating to project directory..."
            cd $PROJECT_PATH || { echo "Project directory not found at $PROJECT_PATH"; exit 1; }

            # Backup current state (optional)
            echo "Creating backup..."
            git stash push -m "Auto-backup before deploy $(date)" || true

            # Pull latest changes from main branch
            echo "Pulling latest changes..."
            git fetch origin
            git reset --hard origin/main

            # Set up environment
            export PATH=$PATH:/root/.bun/bin

            # Install dependencies
            echo "Installing dependencies with Bun..."
            /root/.bun/bin/bun install --frozen-lockfile

            # Build the application
            echo "Building application..."
            /root/.bun/bin/bun run build

            # Create logs directory if it doesn't exist
            mkdir -p logs

            # Restart PM2 process
            echo "Restarting PM2 process..."
            if pm2 describe web > /dev/null; then
              echo "Restarting existing PM2 process..."
              pm2 restart web
            else
              echo "Starting new PM2 process..."
              pm2 start ecosystem.config.cjs
            fi

            # Save PM2 configuration
            pm2 save

            echo "Deployment completed successfully!"
