mutation CreateSale($input: SaleInput!) {
	createSale(input: $input) {
		uuid
		customerName
		customerEmail
		customerPhone
		totalAmount
		paymentTransactions {
			amount
			requestedAmount
			currency
			status
			manualReference
		}
		invoices {
			uuid
			invoiceNumber
		}
		paymentStatus
		saleDate
		createdAt
		updatedAt
		saleStatus
	}
}
