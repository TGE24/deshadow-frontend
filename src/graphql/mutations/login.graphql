mutation Login($input: LoginInput!) {
	login(input: $input) {
		accessToken
		refreshToken
		requires2FA
		challengeToken
		requires2FASetup
		twoFactorSecret
		twoFactorQRCodeURL
		user {
			uuid
			role
			email
			phone
			lastName
			isActive
			firstName
			createdAt
			updatedAt
			role
			ownedStores {
				uuid
				name
			}
		}
	}
}
