mutation LoginWith2FA($challengeToken: String!, $code: String!) {
	loginWith2FA(challengeToken: $challengeToken, code: $code) {
		accessToken
		refreshToken
		challengeToken
		user {
			uuid
			role
			email
			phone
			lastName
			isActive
			firstName
			createdAt
			updatedAt
			ownedStores {
				uuid
				name
				phone
				businessRegistration
				description
				address
				isActive
			}
			createdByMe
			assignedStore {
				uuid
				name
				address
				phone
				isActive
				createdAt
				updatedAt
			}
		}
	}
}
