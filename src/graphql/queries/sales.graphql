query Sales($pagination: PaginationInput, $filter: SaleFilter) {
	sales(pagination: $pagination, filter: $filter) {
		edges {
			node {
				... on Sale {
					uuid
					saleType
					paymentType
					discountAmount
					invoices {
						uuid
						filePath
					}
					store {
						name
					}
					saleDate
					saleStatus
					createdAt
					updatedAt
					totalAmount
					paymentStatus
					customerName
					customerEmail
					customerPhone
					items {
						uuid
						quantity
						unitPrice
						lineTotal
						product {
							name
						}
					}
				}
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
	}
}
