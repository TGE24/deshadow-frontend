query Sales($pagination: PaginationInput, $filter: SaleFilter) {
	sales(pagination: $pagination, filter: $filter) {
		edges {
			node {
				... on Sale {
					uuid
					saleType
					paymentType
					discountAmount
					invoices {
						uuid
						filePath
						invoiceNumber
					}
					store {
						name
					}
					saleDate
					saleStatus
					createdAt
					updatedAt
					totalAmount
					paymentStatus
					customerName
					customerEmail
					customerPhone
					items {
						uuid
						quantity
						unitPrice
						lineTotal
						accessory {
							uuid
							name
						}
						productItem {
							status
							serialNumber
							attributeValues {
								attribute {
									name
									uuid
								}
								valueText
							}
						}
						product {
							name
						}
					}
					createdBy {
						role
						firstName
						lastName
						assignedStore {
							name
						}
					}
				}
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
	}
}
