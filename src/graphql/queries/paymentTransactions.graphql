query PaymentHistory(
	$storeUuid: UUID
	$status: PaymentTransactionStatus
	$startDate: Time
	$endDate: Time
	$pagination: PaginationInput
	$creditProfileUuid: UUID
) {
	paymentTransactions(
		storeUuid: $storeUuid
		status: $status
		startDate: $startDate
		endDate: $endDate
		pagination: $pagination
		creditProfileUuid: $creditProfileUuid
	) {
		edges {
			node {
				__typename
				... on PaymentTransaction {
					uuid
					amount
					paidAt
					channel
					currency
					customerEmail
					requestedAmount
					sale {
						uuid
						saleType
						paymentType
						discountAmount
						store {
							name
						}
						createdBy {
							role
							firstName
							lastName
							assignedStore {
								name
							}
						}
					}
					refunds {
						return {
							uuid
							returnDate
							processedDate
							refundAmount
							product {
								name
							}
						}
					}
				}
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
	}
}
