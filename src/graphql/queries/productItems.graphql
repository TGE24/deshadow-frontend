query ProductItems(
	$productUuid: UUID
	$status: ProductItemStatus
	$pagination: PaginationInput
	$serialNumber: String
) {
	productItems(
		productUuid: $productUuid
		status: $status
		pagination: $pagination
		serialNumber: $serialNumber
	) {
		edges {
			node {
				... on ProductItem {
					uuid
					serialNumber
					condition
					status
					product {
						availableItemsCount
						createdAt
						description
						isOwned
						model
						name
						updatedAt
						uuid
					}
				}
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
	}
}
