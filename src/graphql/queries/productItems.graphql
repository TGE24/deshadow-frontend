query ProductItems($filter: ProductItemFilter, $pagination: PaginationInput) {
	productItems(filter: $filter, pagination: $pagination) {
		edges {
			node {
				... on ProductItem {
					uuid
					serialNumber
					condition
					status
					costPrice
					externalStoreName
					store {
						name
					}
					sellingPrice
					images {
						uuid
						imageUrl
						altText
						isPrimary
						sortOrder
						createdAt
						updatedAt
					}
					product {
						availableItemsCount
						createdAt
						description
						isOwned
						model
						name
						updatedAt
						uuid
						brand {
							name
							uuid
						}
						category {
							name
							uuid
						}
					}
				}
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
	}
}
