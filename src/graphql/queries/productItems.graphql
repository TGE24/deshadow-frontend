query ProductItems($filter: ProductItemFilter, $pagination: PaginationInput) {
	productItems(filter: $filter, pagination: $pagination) {
		edges {
			node {
				... on ProductItem {
					uuid
					serialNumber
					condition
					status
					costPrice
					externalStoreName
					store {
						name
					}
					sellingPrice
					product {
						availableItemsCount
						createdAt
						description
						isOwned
						model
						name
						updatedAt
						uuid
					}
				}
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
	}
}
