query Products($pagination: PaginationInput, $filter: ProductFilter) {
	products(pagination: $pagination, filter: $filter) {
		edges {
			node {
				... on Product {
					uuid
					name
					brand {
						name
						uuid
					}
					model
					images {
						imageUrl
					}
					category {
						name
						uuid
					}
					store {
						name
						uuid
					}
					condition
					costPrice
					sellingPrice
					serialNumber
					description
					specifications
				}
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
	}
}
