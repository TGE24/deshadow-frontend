query Products($pagination: PaginationInput, $filter: ProductFilter) {
	products(pagination: $pagination, filter: $filter) {
		edges {
			node {
				... on Product {
					uuid
					name
					brand {
						name
						uuid
					}
					model
					category {
						name
						uuid
					}
					store {
						name
						uuid
					}
					description
					items {
						uuid
						serialNumber
						condition
						status
					}
				}
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
	}
}
