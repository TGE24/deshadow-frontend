query Product($uuid: UUID!) {
	product(uuid: $uuid) {
		uuid
		name
		brand {
			name
			uuid
		}
		model
		images {
			imageUrl
		}
		category {
			name
			uuid
		}
		store {
			name
			uuid
		}
		images {
			uuid
			imageUrl
			altText
			isPrimary
		}
		description
		items {
			uuid
			serialNumber
			condition
			status
		}
	}
}
