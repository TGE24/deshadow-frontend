query CreditProfile($profileUUID: UUID!) {
	creditProfile(profileUUID: $profileUUID) {
		profile {
			uuid
			customerName
			customerEmail
			customerPhone
		}
		pendingSales {
			sale {
				uuid
				saleType
				paymentType
				discountAmount
				invoices {
					uuid
					filePath
					invoiceNumber
				}
				store {
					name
				}
				saleDate
				saleStatus
				createdAt
				updatedAt
				totalAmount
				paymentStatus
				customerName
				customerEmail
				customerPhone
				items {
					uuid
					quantity
					unitPrice
					lineTotal
					fulfillmentStatus
					createdAt
					updatedAt
					accessory {
						uuid
						name
					}
					productItem {
						status
						serialNumber
						attributeValues {
							attribute {
								name
								uuid
							}
							valueText
						}
					}
					product {
						name
					}
				}
				createdBy {
					role
					firstName
					lastName
					assignedStore {
						name
					}
				}
			}
			paidAmount
			pendingAmount
			originalAmount
		}
		totalPendingAmount
		totalOriginalAmount
		totalPaidAmount
	}
}
