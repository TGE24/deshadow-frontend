query CreditProfiles($pagination: PaginationInput) {
	creditProfiles(pagination: $pagination) {
		edges {
			node {
				__typename
				... on CreditProfile {
					uuid
					customerName
					customerEmail
					customerPhone
					createdAt
					updatedAt
					totalPendingAmount
				}
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
	}
}
