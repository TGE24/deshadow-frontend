query ProductItem($uuid: UUID, $serialNumber: String) {
	productItem(uuid: $uuid, serialNumber: $serialNumber) {
		uuid
		condition
		status
		costPrice
		sellingPrice
		serialNumber
		notes
		product {
			name
		}
		images {
			uuid
			imageUrl
			altText
			isPrimary
			sortOrder
			createdAt
			updatedAt
		}
		attributeValues {
			attribute {
				name
				uuid
			}
			valueText
		}
	}
}
