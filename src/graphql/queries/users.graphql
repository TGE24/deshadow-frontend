query Users($pagination: PaginationInput, $role: UserRole) {
	users(pagination: $pagination, role: $role) {
		edges {
			node {
				... on User {
					uuid
					role
					email
					phone
					lastName
					isActive
					firstName
					assignedStore {
						uuid
						name
					}
				}
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
	}
}
